<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InfoGather</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <link rel="stylesheet" href="./css/app.css?v=20260304e" />
</head>
<body>
  <main class="wrap">
    <section class="head">
      <h1>InfoGather</h1>
      <div class="meta" id="meta">加载中...</div>
    </section>

    <section class="layout">
      <aside class="sidebar sidebar-left">
        <div class="side-title">源选择（树状）</div>
        <div id="tree-root" class="tree-root">arXiv</div>
        <div class="side-ins">
          <button id="ins-btn" class="btn btn-primary side-ins-btn" type="button">拉取更新</button>
          <section id="ins-panel" class="ins-panel side-ins-panel" hidden>
            <div class="ins-row">
              <span id="ins-text">等待中</span>
              <span id="ins-percent">0%</span>
            </div>
            <div class="ins-track"><div id="ins-bar" class="ins-bar"></div></div>
            <div id="ins-log" class="ins-log"></div>
          </section>
        </div>
        <ul id="tree-list" class="tree-list"></ul>
        <div class="side-actions">
          <button id="clear-tags" class="btn" type="button">清空选择</button>
        </div>
      </aside>

      <section class="panel main">
        <div class="controls">
          <input id="q" type="search" placeholder="搜索标题/摘要/作者/标签" />
          <button id="favored-btn" class="btn btn-toggle" type="button" aria-pressed="false">仅收藏</button>
          <button id="day-btn" class="btn btn-toggle" type="button" aria-pressed="false">一天内更新</button>
          <button id="week-btn" class="btn btn-toggle" type="button" aria-pressed="false">一周内更新</button>
          <button id="version-btn" class="btn btn-toggle" type="button" aria-pressed="false">version=1</button>
          <button id="version-not-btn" class="btn btn-toggle" type="button" aria-pressed="false">version!=1</button>
          <button id="search" class="btn btn-primary" type="button">应用过滤</button>
        </div>

        <section id="list" class="list"></section>
        <button id="more" class="btn load-more" type="button" hidden>加载更多</button>
      </section>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="./js/state.js?v=20260304e"></script>
  <script src="./js/api.js?v=20260304e"></script>
  <script src="./js/ui.js?v=20260304e"></script>
  <script src="./js/app.js?v=20260304e"></script>
</body>
</html>
