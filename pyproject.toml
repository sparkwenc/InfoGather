[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "infogather"
version = "0.1.0"
description = "Local web app for tracking research papers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "feedparser",
]

[project.scripts]
info = "infogather.serve:main"

[tool.uv.build-backend]
source-exclude = ["**/.DS_Store"]
